<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>工具箱</title><style>
:root{--bg:#0d1117;--bg2:#131922;--bg3:#1a2230;--line:#242e3c;--fg:#e6edf3;--dim:#8b98a9;--accent:#4c8dff;--green:#3fd39b;--danger:#ff7b7b;--warn:#ffc46b;--radius:12px;}
*{box-sizing:border-box;}html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
button,input,select,textarea{font-family:inherit;}
#app{display:flex;height:100%;overflow:hidden;}
.sidebar{width:228px;flex:0 0 228px;background:var(--bg2);display:flex;flex-direction:column;overflow:hidden;transition:margin-left .25s,transform .25s;z-index:50;}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 12px;font-size:15px;font-weight:600;letter-spacing:.3px;}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--green));display:grid;place-items:center;font-size:13px;}
#nav{flex:1;overflow-y:auto;padding:2px 8px 18px;}
.nav-divider{height:1px;background:var(--line);margin:4px 6px 8px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;margin:2px 0;color:var(--dim);text-decoration:none;border-radius:8px;font-size:13.5px;border-left:2px solid transparent;transition:background .15s,color .15s;}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--fg);}
.nav-item.active{background:rgba(76,141,255,.14);color:#a9c9ff;border-left-color:var(--accent);}
.nav-home{padding-left:10px;}
.item-icon{font-size:14px;width:18px;text-align:center;flex:0 0 18px;}
.sidebar-footer{padding:10px 14px;color:#5c6879;font-size:11px;}
body.sb-hide .sidebar{margin-left:-228px;}
.content{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;flex:0 0 auto;background:var(--bg2);}
.top-btn{background:transparent;border:0;color:var(--dim);border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;display:grid;place-items:center;transition:.15s;}
.top-btn:hover{color:var(--fg);background:rgba(255,255,255,.06);}
.top-btn.on{color:var(--accent);background:rgba(76,141,255,.14);}
.topbar-spacer{flex:1;}
.view{flex:1;overflow-y:auto;padding:14px 16px;}
body.sb-hide .view{padding:8px 10px;}
.home{max-width:1020px;margin:0 auto;}
.home-head{padding:6px 2px 22px;}
.home-head h1{font-size:24px;font-weight:650;margin:0 0 6px;letter-spacing:.4px;background:linear-gradient(100deg,#e6edf3 30%,#7fa8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.home-head p{margin:0;color:var(--dim);font-size:13px;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:14px;align-items:start;}
.home-card{position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;transition:border-color .2s,transform .2s;}
.home-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--green));opacity:.3;transition:opacity .25s;}
.home-card:hover{border-color:#2f3d4e;transform:translateY(-1px);}
.home-card:hover::before{opacity:.9;}
.home-card-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;}
.home-ico{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;font-size:15px;color:#a9c9ff;background:linear-gradient(135deg,rgba(76,141,255,.22),rgba(63,211,155,.16));border:1px solid rgba(76,141,255,.22);}
.home-card h2{margin:1px 0 3px;font-size:15px;font-weight:600;}
.home-card .desc{margin:0;font-size:12.5px;color:var(--dim);}
.home-card a.open{display:inline-block;margin-top:8px;font-size:12.5px;color:#9fc3ff;text-decoration:none;}
.home-card a.open:hover{color:#cfe0ff;}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
.btn:hover{background:#232c38;border-color:#33404f;}
.btn:active{transform:scale(.98);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn.primary:hover{background:#3d7ce8;}
.btn.ghost{background:transparent;color:var(--dim);}
.btn.ghost:hover{color:var(--fg);border-color:#3a4553;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.input,.select{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;outline:none;color:var(--fg);font-size:13.5px;transition:border-color .15s;}
.input:focus,.select:focus{border-color:var(--accent);}
.label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;}
.form-row{margin-bottom:12px;}
.form-row-inline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.form-row-inline>*{flex:1;min-width:80px;}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;}
.plot{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
body.sb-hide .plot,body.sb-hide .solver,body.sb-hide .mol,body.sb-hide .phys{max-width:none;}
.plot-main{padding:0;overflow:hidden;}
.plot-cw{position:relative;background:var(--bg);}
.plot-cw canvas{display:block;width:100%;height:340px;cursor:grab;touch-action:none;}
.plot-cw canvas:active{cursor:grabbing;}
.plot-sliders{padding:10px 16px 4px;background:var(--bg2);}
.plot-param-item{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.plot-param-name{width:30px;font-family:Consolas,monospace;font-weight:600;color:var(--accent);font-size:13px;flex:0 0 30px;}
.plot-param-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer;}
.plot-param-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px rgba(76,141,255,.18);}
.plot-param-slider::-moz-range-thumb{width:16px;height:16px;background:var(--accent);border-radius:50%;cursor:pointer;border:0;}
.plot-param-value{width:54px;text-align:right;font-family:Consolas,monospace;font-size:12.5px;color:var(--dim);flex:0 0 54px;}
.plot-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px 14px;background:var(--bg2);}
.plot-bar .input{width:66px;}
.plot-modes{display:flex;gap:6px;padding:12px 16px 0;}
.plot-mode{padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--dim);font-size:12.5px;cursor:pointer;transition:.15s;}
.plot-mode:hover{color:var(--fg);}
.plot-mode.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.plot-func-item{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding:8px;background:var(--bg3);border-radius:8px;}
.plot-func-color{width:16px;height:16px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.2);}
.plot-func-input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:Consolas,monospace;font-size:13px;outline:none;color:var(--fg);min-width:0;}
.plot-func-input:focus{border-color:var(--accent);}
.plot-func-remove{color:var(--danger);padding:4px 8px;border-radius:6px;background:transparent;cursor:pointer;font-size:16px;border:0;}
.plot-func-remove:hover{background:rgba(255,123,123,.12);}
.plot-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.plot-preset{padding:5px 10px;font-size:12px;background:var(--bg3);border-radius:6px;color:var(--dim);cursor:pointer;border:1px solid var(--line);transition:.15s;}
.plot-preset:hover{color:var(--fg);border-color:#3a4553;}
.solver{max-width:780px;margin:0 auto;}
.solver-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.solver-tab{padding:9px 14px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;cursor:pointer;font-size:13.5px;background:transparent;border-top:0;border-left:0;border-right:0;font-family:inherit;}
.solver-tab:hover{color:var(--fg);}
.solver-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.solver-pane{display:none;}
.solver-pane.active{display:block;}
.solver-result{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px;min-height:50px;}
.solver-result-title{font-size:12.5px;color:var(--dim);margin-bottom:8px;letter-spacing:.5px;}
.solver-result-content{font-family:Consolas,monospace;font-size:14px;line-height:1.8;}
.solver-system-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.solver-coeff{width:64px;text-align:center;}
.mol{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.mol-tabs{display:flex;flex-wrap:wrap;gap:6px;}
.mol-tab{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:12.5px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;user-select:none;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.mol-tab:hover{color:var(--fg);border-color:#33404f;background:#1a2230;}
.mol-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.mol-stage{position:relative;width:100%;height:clamp(340px,62vh,600px);background:radial-gradient(ellipse at 50% 35%,#18212e 0%,#0a0f16 78%);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;}
.mol-stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;}
.mol-stage canvas.dragging{cursor:grabbing;}
.mol-info{position:absolute;top:12px;left:14px;pointer-events:none;max-width:62%;}
.mol-info .name{font-size:16px;font-weight:650;color:var(--fg);text-shadow:0 2px 10px rgba(0,0,0,.8);}
.mol-info .formula{font-size:12.5px;color:#9fc3ff;margin-top:3px;font-family:Consolas,monospace;text-shadow:0 2px 10px rgba(0,0,0,.8);}
.mol-info .detail{font-size:11.5px;color:#7b8697;margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.8);line-height:1.6;}
.mol-hint{position:absolute;bottom:10px;left:14px;font-size:11px;color:#4d5765;pointer-events:none;}
.mol-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;}
.mol-tools button{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(16,23,33,.78);color:var(--fg);font-size:14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .15s,border-color .15s,transform .08s;display:grid;place-items:center;-webkit-tap-highlight-color:transparent;}
.mol-tools button:hover{background:rgba(76,141,255,.22);border-color:rgba(76,141,255,.45);}
.mol-tools button:active{transform:scale(.92);}
.mol-tools button.on{background:rgba(76,141,255,.3);border-color:rgba(76,141,255,.6);color:#cfe0ff;}
.mol-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;font-size:12.5px;}
.mol-controls label{display:flex;align-items:center;gap:6px;color:var(--dim);cursor:pointer;user-select:none;padding:5px 8px;border-radius:8px;transition:background .15s,color .15s;font-size:12.5px;}
.mol-controls label:hover{background:rgba(255,255,255,.04);color:var(--fg);}
.mol-controls input[type="checkbox"]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.mol-controls .spacer{flex:1;}
.mol-controls button.ctl{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12.5px;cursor:pointer;transition:.15s;}
.mol-controls button.ctl:hover{color:var(--fg);border-color:#3a4553;}
.mol-controls button.ctl.on{background:rgba(76,141,255,.18);border-color:rgba(76,141,255,.45);color:#cfe0ff;}
.mol-custom{display:none;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;grid-template-columns:1fr 1fr;gap:12px;}
.mol-custom.open{display:grid;}
.mc-field{display:flex;flex-direction:column;gap:5px;}
.mc-field label{font-size:11.5px;color:var(--dim);}
.mc-field input{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-size:13px;outline:none;transition:border-color .15s;}
.mc-field input:focus{border-color:var(--accent);}
.mc-field.full{grid-column:1/-1;}
.mc-actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;}
.mc-msg{grid-column:1/-1;font-size:12px;color:var(--dim);min-height:16px;}
.mc-msg.error{color:var(--danger);}
.mc-msg.ok{color:var(--green);}
.phys{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
.phys-card{padding:0;overflow:hidden;position:relative;}
.phys-card canvas{display:block;width:100%;height:clamp(340px,60vh,560px);background:radial-gradient(ellipse at 50% 40%,#141c28 0%,#0a0f16 80%);cursor:grab;touch-action:none;}
.phys-card canvas:active{cursor:grabbing;}
.phys-bar{padding:12px 14px;}
.ph-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.ph-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--dim);}
.ph-chk{display:flex;align-items:center;gap:6px;cursor:pointer;padding:5px 9px;border-radius:8px;border:1px solid var(--line);}
.ph-chk input{accent-color:var(--accent);}
.ph-range{-webkit-appearance:none;appearance:none;height:4px;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer;}
.ph-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;}
.ph-range::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer;border:0;}
.ph-val{font-size:11.5px;color:var(--dim);min-width:46px;text-align:right;font-family:Consolas,monospace;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-size:12.5px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:border-color .15s;margin-right:6px;margin-bottom:6px;}
.chip:hover{border-color:#3a4553;}
.chip.on{border-color:var(--accent);outline:1px solid rgba(76,141,255,.35);}
.chip b{color:#9fc3ff;font-family:Consolas,monospace;}
.chip button{background:transparent;border:0;color:var(--danger);cursor:pointer;font-size:14px;padding:0 2px;border-radius:5px;}
.chip button:hover{background:rgba(255,123,123,.15);}
.modal-mask{position:fixed;inset:0;background:rgba(5,8,12,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:18px;}
.modal-mask.show{display:flex;}
.modal-card{width:min(480px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;max-height:88vh;overflow-y:auto;}
.modal-card .modal-title{font-size:16px;font-weight:650;margin-bottom:14px;}
.mf{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1;min-width:70px;}
.mf label{font-size:11.5px;color:var(--dim);}
.mf-row{display:flex;gap:10px;flex-wrap:wrap;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
.placeholder{max-width:560px;margin:64px auto;text-align:center;color:var(--dim);}
.placeholder h2{color:var(--fg);margin:14px 0 6px;font-size:19px;}
.ph-icon{font-size:42px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#26303d;border-radius:5px;border:2px solid var(--bg2);}
::-webkit-scrollbar-thumb:hover{background:#33404f;}
@media (max-width:980px){.plot,.solver,.mol,.phys{max-width:100%;}}
@media (max-width:760px){.sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);}.sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.7);}body.sb-hide .sidebar{margin-left:0;transform:translateX(-100%);}.view{padding:12px;}.home-head h1{font-size:21px;}.home-grid{grid-template-columns:1fr;gap:12px;}.plot-cw canvas{height:240px;}.mol-stage{height:clamp(300px,56vh,480px);}.mol-info .name{font-size:15px;}.mol-custom{grid-template-columns:1fr;}.solver-tab{padding:8px 10px;font-size:12.5px;}}
</style></head><body>
<div id="app">
<aside class="sidebar" id="sidebar">
<div class="brand"><span class="logo">🧰</span><span>工具箱</span></div>
<nav id="nav"></nav>
</aside>
<div class="content">
<header class="topbar">
<button class="top-btn" id="menuBtn" title="切换侧边栏">☰</button>
<div class="topbar-spacer"></div>
<button class="top-btn" id="fsBtn" title="全屏">⛶</button>
</header>
<main class="view" id="view"></main>
</div>
</div>
<script>
/* ===== 数学表达式引擎 ===== */
const Engine=(function(){var ANG='deg',tc={};var CONST={pi:Math.PI,e:Math.E,tau:Math.PI*2,phi:(1+Math.sqrt(5))/2};var FUN={};
function d1(n,f){FUN[n]={mn:1,mx:1,f:f};}function dn(n,a,b,f){FUN[n]={mn:a,mx:b,f:f};}
function tor(x){return ANG==='deg'?x*Math.PI/180:x;}function frr(x){return ANG==='deg'?x*180/Math.PI:x;}
function N(v){if(typeof v!=='number'||!isFinite(v))throw Error('数值无效');return v;}
d1('sin',function(a){return Math.sin(tor(N(a)));});d1('cos',function(a){return Math.cos(tor(N(a)));});
d1('tan',function(a){var r=tor(N(a)),c=Math.cos(r);if(Math.abs(c)<1e-14)throw Error('tan 无定义');return Math.sin(r)/c;});
d1('asin',function(a){return frr(Math.asin(N(a)));});d1('acos',function(a){return frr(Math.acos(N(a)));});d1('atan',function(a){return frr(Math.atan(N(a)));});
d1('sinh',function(a){return Math.sinh(N(a));});d1('cosh',function(a){return Math.cosh(N(a));});d1('tanh',function(a){return Math.tanh(N(a));});
d1('abs',function(a){return Math.abs(N(a));});d1('sqrt',function(a){return Math.sqrt(N(a));});d1('cbrt',function(a){return Math.cbrt(N(a));});
d1('exp',function(a){return Math.exp(N(a));});d1('ln',function(a){return Math.log(N(a));});d1('log',function(a){return Math.log10(N(a));});d1('log2',function(a){return Math.log2(N(a));});
d1('floor',function(a){return Math.floor(N(a));});d1('ceil',function(a){return Math.ceil(N(a));});d1('round',function(a){return Math.round(N(a));});d1('trunc',function(a){return Math.trunc(N(a));});d1('sign',function(a){return Math.sign(N(a));});
dn('pow',2,2,function(a,b){return Math.pow(N(a),N(b));});dn('mod',2,2,function(a,b){var x=N(a),y=N(b);return((x%y)+y)%y;});
dn('max',1,9,function(){var a=[].slice.call(arguments).map(N);return Math.max.apply(null,a);});dn('min',1,9,function(){var a=[].slice.call(arguments).map(N);return Math.min.apply(null,a);});
dn('root',2,2,function(x,n){x=N(x);n=N(n);if(x<0&&Number.isInteger(n)&&n%2)return -Math.pow(-x,1/n);return Math.pow(x,1/n);});
d1('fact',function(a){a=N(a);if(!Number.isInteger(a)||a<0)throw Error('阶乘需非负整数');if(a>170)return Infinity;var r=1;for(var k=2;k<=a;k++)r*=k;return r;});
function tk(s){if(tc[s])return tc[s];var o=[],i=0;
while(i<s.length){var c=s[i];
if(/\s/.test(c)){i++;continue;}
if(c==='π'){o.push({t:'i',v:'pi'});i++;continue;}
if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){var j=i,dot=0;while(j<s.length&&(/[0-9]/.test(s[j])||(s[j]==='.'&&!dot))){if(s[j]==='.')dot=1;j++;}

function rs(){var r=cv.parentElement.getBoundingClientRect();var w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));var dpr=Math.min(window.devicePixelRatio||1,2);W=w;H=h;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function sx(x){return (x-st.cx)*st.scale+W/2;}
function sy(y){return H/2-(y-st.cy)*st.scale;}
function wxScreen(s){return st.cx+(s-W/2)/st.scale;}
function wyScreen(s){return st.cy-(s-H/2)/st.scale;}
function hue(i){return (i*67)%360;}

function mkBody(o){
  var b={shape:o.shape,x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,angle:o.angle||0,av:0,mass:o.mass||1,fric:o.fric!==undefined?o.fric:0.3,res:o.res!==undefined?o.res:0.5,chg:o.chg||0,static:!!o.static,canRotate:o.canRotate!==undefined?o.canRotate:true,id:++st.id};
  if(o.shape==='circle'){b.r=o.r;b.w=b.r*2;b.h=b.r*2;}
  else{b.w=o.w;b.h=o.h;b.r=Math.hypot(b.w,b.h)/2;}

function bodyCorners(b){
  if(b.shape==='circle')return null;
  var hw=b.w/2,hh=b.h/2,c=Math.cos(b.angle),s=Math.sin(b.angle);
  return[{x:b.x+c*(-hw)-s*(-hh),y:b.y+s*(-hw)+c*(-hh)},{x:b.x+c*hw-s*(-hh),y:b.y+s*hw+c*(-hh)},{x:b.x+c*hw-s*hh,y:b.y+s*hw+c*hh},{x:b.x+c*(-hw)-s*hh,y:b.y+s*(-hw)+c*hh}];
}

function polyPolyMTV(A,B){
  var best=null;
  function testAxes(p1,p2){
    for(var i=0;i<p1.length;i++){
      var j=(i+1)%p1.length;
      var ex=p1[j].x-p1[i].x,ey=p1[j].y-p1[i].y;
      var len=Math.hypot(ex,ey);
      if(len<1e-10)continue;
      var ax=-ey/len,ay=ex/len;
      var min1=Infinity,max1=-Infinity,min2=Infinity,max2=-Infinity;
      for(var k=0;k<p1.length;k++){var pr=p1[k].x*ax+p1[k].y*ay;if(pr<min1)min1=pr;if(pr>max1)max1=pr;}
      for(var k2=0;k2<p2.length;k2++){var pr2=p2[k2].x*ax+p2[k2].y*ay;if(pr2<min2)min2=pr2;if(pr2>max2)max2=pr2;}
      var ov=Math.min(max1,max2)-Math.max(min1,min2);
      if(ov<=0)return false;
      if(!best||ov<best.depth){
        var dir=(min2+max2)/2-(min1+max1)/2;
        var nx=ax,ny=ay;
        if(dir<0){nx=-nx;ny=-ny;}
        best={nx:nx,ny:ny,depth:ov};
      }
    }
    return true;
  }
  if(!testAxes(A,B))return null;
  if(!testAxes(B,A))return null;
  return best;
}

function circlePolyMTV(cx,cy,cr,poly){
  var axes=[];
  for(var i=0;i<poly.length;i++){
    var j=(i+1)%poly.length;
    var ex=poly[j].x-poly[i].x,ey=poly[j].y-poly[i].y;
    var len=Math.hypot(ex,ey);
    if(len>1e-10)axes.push({x:-ey/len,y:ex/len});
  }
  var minD=Infinity,mvx=0,mvy=0;
  for(var k=0;k<poly.length;k++){
    var dx=poly[k].x-cx,dy=poly[k].y-cy;
    var d=Math.hypot(dx,dy);
    if(d<minD){minD=d;mvx=dx;mvy=dy;}
  }
  if(minD>1e-10)axes.push({x:mvx/minD,y:mvy/minD});
  var best=null;
  for(var a=0;a<axes.length;a++){
    var ax=axes[a].x,ay=axes[a].y;
    var cp=cx*ax+cy*ay;
    var cmin=cp-cr,cmax=cp+cr;
    var minP=Infinity,maxP=-Infinity;
    for(var p=0;p<poly.length;p++){var proj=poly[p].x*ax+poly[p].y*ay;if(proj<minP)minP=proj;if(proj>maxP)maxP=proj;}
    var ov=Math.min(cmax,maxP)-Math.max(cmin,minP);
    if(ov<=0)return null;
    if(!best||ov<best.depth){
      var dir=(minP+maxP)/2-cp;
      var nx=ax,ny=ay;
      if(dir<0){nx=-nx;ny=-ny;}
      best={nx:nx,ny:ny,depth:ov};
    }
  }
  return best;
}

function collideBodies(A,B){
  if(A.shape==='circle'&&B.shape==='circle'){
    var dx=B.x-A.x,dy=B.y-A.y;
    var d=Math.hypot(dx,dy);
    var rsum=A.r+B.r;
    if(d>=rsum)return null;
    if(d<1e-10)return{nx:0,ny:-1,depth:rsum};
    return{nx:dx/d,ny:dy/d,depth:rsum-d};
  }
  if(A.shape==='circle')return circlePolyMTV(A.x,A.y,A.r,bodyCorners(B));
  if(B.shape==='circle')return circlePolyMTV(B.x,B.y,B.r,bodyCorners(A));
  return polyPolyMTV(bodyCorners(A),bodyCorners(B));
}

function resolvePair(A,B){
  if(A===st.dragBody||B===st.dragBody)return;
  if(A.static&&B.static)return;
  var mtv=collideBodies(A,B);
  if(!mtv)return;
  var invA=A.static?0:1/A.mass;
  var invB=B.static?0:1/B.mass;
  var sum=invA+invB;
  if(sum<=0)return;
  var slop=0.005;
  var percent=0.35;
  var corr=Math.max(mtv.depth-slop,0)*percent/sum;
  A.x-=mtv.nx*corr*invA;
  A.y-=mtv.ny*corr*invA;
  B.x+=mtv.nx*corr*invB;
  B.y+=mtv.ny*corr*invB;
  var rvx=B.vx-A.vx,rvy=B.vy-A.vy;
  var vn=rvx*mtv.nx+rvy*mtv.ny;
  if(vn>0)return;
  var res=0;
  if(Math.abs(vn)>2.0)res=Math.min(A.res||0.5,B.res||0.5);
  var j=-(1+res)*vn/sum;
  var tx=-mtv.ny,ty=mtv.nx;
  var vt=rvx*tx+rvy*ty;
  var fri=Math.sqrt((A.fric||0.3)*(B.fric||0.3));
  var jt=-vt/sum;
  var maxJt=fri*Math.abs(j);
  if(jt>maxJt)jt=maxJt;
  if(jt<-maxJt)jt=-maxJt;
  A.vx-=j*mtv.nx*invA;
  A.vy-=j*mtv.ny*invA;
  B.vx+=j*mtv.nx*invB;
  B.vy+=j*mtv.ny*invB;
  A.vx-=jt*tx*invA;
  A.vy-=jt*ty*invA;
  B.vx+=jt*tx*invB;
  B.vy+=jt*ty*invB;
}

function physicsStep(dt){
  var i,j,b;
  var K=650;
  for(i=0;i<st.bodies.length;i++){
    b=st.bodies[i];
    if(b.static)continue;
    var ax=0,ay=st.g;
    for(j=0;j<st.bodies.length;j++){
      if(i===j)continue;
      var o=st.bodies[j];
      if(b.chg&&o.chg){
        var dx=o.x-b.x,dy=o.y-b.y;
        var r2=dx*dx+dy*dy+0.01;
        var r=Math.sqrt(r2);
        var f=K*b.chg*o.chg/r2;
        if(f>500)f=500;if(f<-500)f=-500;
        ax+=f*dx/r;ay+=f*dy/r;
      }
    }
    b.vx+=ax*dt;
    b.vy+=ay*dt;
    var damp=Math.exp(-1.2*dt);
    b.vx*=damp;b.vy*=damp;
    var v=Math.hypot(b.vx,b.vy);
    if(v>50){b.vx*=50/v;b.vy*=50/v;}
    b.x+=b.vx*dt;
    b.y+=b.vy*dt;
    if(b.canRotate&&b.shape==='rect'){
      b.angle+=(b.av||0)*dt;
      b.av=(b.av||0)*Math.exp(-2.5*dt);
    }
    if(!isFinite(b.x)||!isFinite(b.y)){b.x=0;b.y=1.6;b.vx=0;b.vy=0;b.av=0;}
  }
  for(var iter=0;iter<4;iter++){
    for(var i1=0;i1<st.bodies.length;i1++){
      for(var i2=i1+1;i2<st.bodies.length;i2++){
        var A=st.bodies[i1],B=st.bodies[i2];
        if(A.static&&B.static)continue;
        if(A===st.dragBody||B===st.dragBody)continue;
        resolvePair(A,B);
      }
    }
  }
}

function follow(){
  if(!st.follow)return;
  var n=0,mx=0,my=0;
  for(var i=0;i<st.bodies.length;i++){
    var b=st.bodies[i];
    if(b.static)continue;
    if(!isFinite(b.x)||!isFinite(b.y))continue;
    mx+=b.x;my+=b.y;n++;
  }
  if(!n)return;
  mx/=n;my/=n;
  var maxD=2;
  for(var j=0;j<st.bodies.length;j++){
    var bb=st.bodies[j];
    if(bb.static)continue;
    if(!isFinite(bb.x)||!isFinite(bb.y))continue;
    var d=Math.hypot(bb.x-mx,bb.y-my);
    if(bb.shape==='circle')d+=bb.r;
    else d+=Math.hypot(bb.w,bb.h)/2;
    if(d>maxD)maxD=d;
  }
  var targetScale=Math.min(W,H)*0.36/maxD;
  targetScale=Math.max(12,Math.min(200,targetScale));
  var k=0.10;
  st.cx+=(mx-st.cx)*k;
  st.cy+=(my-st.cy)*k;
  st.scale+=(targetScale-st.scale)*k;
}

function drawGround(g){
  /* 物理边界：世界 y ∈ [g.y - g.h/2, g.y + g.h/2] */
  var topS=sy(g.y+g.h/2);   /* 顶面屏幕 y（y 值大 -> 屏幕靠上） */
  var botS=sy(g.y-g.h/2);   /* 底面屏幕 y */
  var ht=botS-topS;
  /* 填充主体 */
  ctx.fillStyle='rgba(130,140,160,0.35)';
  ctx.fillRect(0,topS,W,ht);
  /* 上下边界线 */
  ctx.strokeStyle='rgba(180,195,220,0.85)';
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(0,topS);ctx.lineTo(W,topS);
  ctx.moveTo(0,botS);ctx.lineTo(W,botS);
  ctx.stroke();
  /* 顶面高亮：细线强调 */
  ctx.strokeStyle='rgba(220,235,255,0.55)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,topS);ctx.lineTo(W,topS);ctx.stroke();
  /* 底面下方的倾斜斑马线 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,botS,W,22);
  ctx.clip();
  ctx.strokeStyle='rgba(150,165,190,0.4)';
  ctx.lineWidth=1;
  for(var xx=-20;xx<W+20;xx+=10){
    ctx.beginPath();
    ctx.moveTo(xx,botS);
    ctx.lineTo(xx+12,botS+12);
    ctx.stroke();
  }
  ctx.restore();
}
function drawWall(w){
  var corners=bodyCorners(w);if(!corners)return;
  var sp=corners.map(function(p){return{x:sx(p.x),y:sy(p.y)};});
  ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);
  for(var i=1;i<4;i++)ctx.lineTo(sp[i].x,sp[i].y);
  ctx.closePath();
  ctx.fillStyle='rgba(130,140,160,0.35)';ctx.fill();
  ctx.strokeStyle='rgba(180,195,220,0.8)';ctx.lineWidth=1.5;ctx.stroke();
  var p1=sp[3],p2=sp[0];
  var dx=p2.x-p1.x,dy=p2.y-p1.y,len=Math.hypot(dx,dy);
  if(len<1)return;
  var ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  var cx4=(sp[0].x+sp[1].x+sp[2].x+sp[3].x)/4,cy4=(sp[0].y+sp[1].y+sp[2].y+sp[3].y)/4;
  var vx2=(p1.x+p2.x)/2-cx4,vy2=(p1.y+p2.y)/2-cy4;
  if(nx*vx2+ny*vy2<0){nx=-nx;ny=-ny;}
  ctx.save();ctx.beginPath();
  ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p2.x+nx*10,p2.y+ny*10);ctx.lineTo(p1.x+nx*10,p1.y+ny*10);ctx.closePath();ctx.clip();
  ctx.strokeStyle='rgba(150,165,190,0.4)';ctx.lineWidth=1;
  for(var t=-20;t<len+20;t+=10){
    var fx=p1.x+ux*t,fy=p1.y+uy*t;
    ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+nx*12+ux*12,fy+ny*12+uy*12);ctx.stroke();
  }
  ctx.restore();
}
function drawB(b){
  var k=st.scale;
  if(!isFinite(k)||!isFinite(b.x)||!isFinite(b.y))return;
  if(b.shape==='circle'){
    var r=b.r*k;if(r<0.5)return;
    var x=sx(b.x),y=sy(b.y);
    if(k>=4){
      var g=ctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
      g.addColorStop(0,'hsl('+hue(b.id)+',85%,72%)');g.addColorStop(.55,'hsl('+hue(b.id)+',70%,52%)');g.addColorStop(1,'hsl('+hue(b.id)+',65%,30%)');
      ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=g;ctx.fill();
    }else{ctx.beginPath();ctx.arc(x,y,Math.max(1.2,r),0,6.2832);ctx.fillStyle='hsl('+hue(b.id)+',70%,55%)';ctx.fill();}
    ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.stroke();
    if(k>=8&&b.chg){ctx.fillStyle='#fff';ctx.font='bold '+(r*.55)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.chg>0?'+':'−',x,y+1);}
  }else{
    var corners=bodyCorners(b);if(!corners)return;
    var sp=corners.map(function(p){return{x:sx(p.x),y:sy(p.y)};});
    ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);
    for(var i=1;i<4;i++)ctx.lineTo(sp[i].x,sp[i].y);
    ctx.closePath();
    ctx.fillStyle='hsl('+hue(b.id)+',55%,44%)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.stroke();
    if(k>=6&&b.chg){
      var cx2=sx(b.x),cy2=sy(b.y);
      ctx.fillStyle='#fff';ctx.font='bold '+Math.min(Math.min(b.w,b.h)*k*.5,16)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.chg>0?'+':'−',cx2,cy2+1);
    }
  }
  if(b===st.sel&&k>=5){
    ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    if(b.shape==='circle'){ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),b.r*k+4,0,6.2832);ctx.stroke();}
    else{
      var cor=bodyCorners(b);
      if(cor){
        var s2=cor.map(function(p){return{x:sx(p.x),y:sy(p.y)};});
        ctx.beginPath();ctx.moveTo(s2[0].x,s2[0].y);
        for(var ii=1;ii<4;ii++)ctx.lineTo(s2[ii].x,s2[ii].y);
        ctx.closePath();ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }
}
function draw(){
  ctx.fillStyle='#0b0e13';ctx.fillRect(0,0,W,H);
  var step=40/st.scale;
  while(step<1)step*=2;while(step>4)step/=2;
  var gx0=Math.floor(wxScreen(0)/step)*step,gx1=Math.ceil(wxScreen(W)/step)*step;
  ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;ctx.beginPath();
  for(var gx=gx0;gx<=gx1;gx+=step){ctx.moveTo(sx(gx),0);ctx.lineTo(sx(gx),H);}

  for(var gy=gy0;gy<=gy1;gy+=step){ctx.moveTo(0,sy(gy));ctx.lineTo(W,sy(gy));}
  ctx.stroke();
  ctx.strokeStyle='rgba(120,160,255,.22)';ctx.lineWidth=1;
  if(wxScreen(0)>=-20&&wxScreen(0)<=W+20){ctx.beginPath();ctx.moveTo(sx(0),0);ctx.lineTo(sx(0),H);ctx.stroke();}
  if(wyScreen(0)>=-20&&wyScreen(0)<=H+20){ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(W,sy(0));ctx.stroke();}
  for(var i=0;i<st.bodies.length;i++){
    var b=st.bodies[i];
    if(b.shape==='wall'){
      if(b.isGround)drawGround(b);else drawWall(b);
    }
  }
  for(var j=0;j<st.bodies.length;j++){
    var d=st.bodies[j];
    if(d.shape!=='wall')drawB(d);
  }
}
function hitTest(px,py){
  var wx2=wxScreen(px),wy2=wyScreen(py);
  for(var i=st.bodies.length-1;i>=0;i--){
    var b=st.bodies[i];
    if(b.shape==='wall'&&b.isGround)continue;
    if(b.shape==='circle'){if(Math.hypot(b.x-wx2,b.y-wy2)<=b.r)return b;}
    else{var cor=bodyCorners(b);if(cor&&pointInPoly(wx2,wy2,cor))return b;}
  }
  return null;
}
function pointInPoly(px,py,poly){
  var c=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))c=!c;
  }
  return c;
}

var grab=null,grabOff=null,pan=null,lastP=null;

  if(e.cancelable)e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(x){}
  var r=cv.getBoundingClientRect();
  var px=e.clientX-r.left,py=e.clientY-r.top;
  var b=hitTest(px,py);
  if(b){
    grab=b;st.dragBody=b;
    grabOff={x:wxScreen(px)-b.x,y:wyScreen(py)-b.y};
    lastP={x:px,y:py};
    cv.style.cursor='grabbing';

});
cv.addEventListener('pointermove',function(e){
  var r=cv.getBoundingClientRect();
  var px=e.clientX-r.left,py=e.clientY-r.top;
  if(grab){
    grab.x=wxScreen(px)-grabOff.x;
    grab.y=wyScreen(py)-grabOff.y;
    var dx=px-(lastP?lastP.x:px),dy=py-(lastP?lastP.y:py);
    if(lastP&&(Math.abs(dx)>0||Math.abs(dy)>0)){
      grab.vx=dx/st.scale*120;grab.vy=-dy/st.scale*120;

function isTextInput(el){
  if(!el)return false;
  var tag=(el.tagName||'').toUpperCase();
  if(tag==='TEXTAREA')return true;
  if(tag==='INPUT'){
    var t=(el.type||'text').toLowerCase();
    if(t==='text'||t==='number'||t==='search'||t==='email'||t==='password'||t==='tel'||t==='url')return true;
  }
  if(el.isContentEditable)return true;
  return false;
}
function onKeyDown(e){
  if(!cv.isConnected)return;
  if(isTextInput(e.target))return;
  var k=e.key.toLowerCase();
  if(k==='w'||k==='a'||k==='s'||k==='d'){
    keys[k]=true;
    if(st.follow){
      st.follow=false;
      var fol=root.querySelector('#pfol');
      if(fol)fol.checked=false;
    }
    e.preventDefault();
  }
}
function onKeyUp(e){
  if(!cv.isConnected)return;
  var k=e.key.toLowerCase();
  if(k==='w'||k==='a'||k==='s'||k==='d'){
    keys[k]=false;
    e.preventDefault();
  }
}

function tick(){
  raf=null;
  if(!cv.isConnected)return;
  if(st.run){
    var dt=1/60;
    var sub=5,sdt=dt/sub;
    for(var s=0;s<sub;s++)physicsStep(sdt);
    var ms=st.wasdSens;
    var moving=false;
    if(keys['w']){st.cy+=ms*dt/st.scale;moving=true;}
    if(keys['s']){st.cy-=ms*dt/st.scale;moving=true;}
    if(keys['a']){st.cx-=ms*dt/st.scale;moving=true;}
    if(keys['d']){st.cx+=ms*dt/st.scale;moving=true;}
    if(!moving&&st.follow)follow();
  }
  draw();
  requestAnimationFrame(tick);
}

Co:[2,3],Ni:[2],Cu:[1,2],Zn:[2],Ga:[3],Ge:[4],As:[3,5],Se:[4,6],Br:[1,5,7]};

var PERIODIC={1:{1:'H',18:'He'},2:{1:'Li',2:'Be',13:'B',14:'C',15:'N',16:'O',17:'F',18:'Ne'},3:{1:'Na',2:'Mg',13:'Al',14:'Si',15:'P',16:'S',17:'Cl',18:'Ar'},4:{1:'K',2:'Ca',3:'Sc',4:'Ti',5:'V',6:'Cr',7:'Mn',8:'Fe',9:'Co',10:'Ni',11:'Cu',12:'Zn',13:'Ga',14:'Ge',15:'As',16:'Se',17:'Br',18:'Kr'}};
var ALL_ELEMS={};Object.keys(PERIODIC).forEach(function(r){Object.keys(PERIODIC[r]).forEach(function(c){ALL_ELEMS[PERIODIC[r][c]]=1;});});

var SUB='₀₁₂₃₄₅₆₇₈₉';
var SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
var SUPSIGN={'+':'⁺','-':'⁻','−':'⁻'};
function toSub(s){var o='';for(var i=0;i<s.length;i++){var c=s[i];var idx='0123456789'.indexOf(c);o+=idx>=0?SUB[idx]:c;}return o;}
function toSup(s){var o='';for(var i=0;i<s.length;i++){var c=s[i];var idx='0123456789'.indexOf(c);if(idx>=0)o+=SUP[idx];else if(SUPSIGN[c])o+=SUPSIGN[c];else o+=c;}return o;}
function unicodeToPlain(s){
return s.replace(/[₀₁₂₃₄₅₆₇₈₉]/g,function(c){return '0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(c)];})
.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,function(c){return '0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)];})
.replace(/[⁺⁻]/g,function(c){return c==='⁺'?'+':'-';});}

function matchElement(s,i){
if(i+1<s.length&&/[a-zA-Z]/.test(s[i])&&/[a-zA-Z]/.test(s[i+1])){
var two=s[i].toUpperCase()+s[i+1].toLowerCase();
if(ALL_ELEMS[two])return{sym:two,len:2};}
var one=s[i].toUpperCase();
if(ALL_ELEMS[one])return{sym:one,len:1};
return null;}

function protect(s){
var result='',i=0;
while(i<s.length){
var c=s[i];
if(/[0-9()]/.test(c)){result+=c;i++;continue;}
if(i+1<s.length&&/[a-zA-Z]/.test(s[i])&&/[a-zA-Z]/.test(s[i+1])){
var two=s[i].toUpperCase()+s[i+1].toLowerCase();
var oneA=s[i].toUpperCase(),oneB=s[i+1].toUpperCase();
if(ALL_ELEMS[two]&&ALL_ELEMS[oneA]&&ALL_ELEMS[oneB]&&/[A-Z]/.test(s[i+1])){
result+=oneA+ZWSP;i++;continue;}}
var el=matchElement(s,i);
if(el){result+=el.sym;i+=el.len;continue;}
result+=c;i++;}
return result;}

function isSeparator(str,i){
var j=i+1;
while(j<str.length&&isSp(str[j]))j++;
if(j>=str.length)return false;
var c=str[j];
if(c==='='||c==='+'||c==='-')return false;
if(c==='e'||c==='E')return false;
if(/[a-zA-Z(]/.test(c))return true;
return false;}

function tokenizeRaw(str){
var tokens=[],i=0;
while(i<str.length){
var c=str[i];
if(isSp(c)){tokens.push({t:'sp'});i++;continue;}
if(c==='-'&&i+1<str.length&&str[i+1]==='>'){tokens.push({t:'arrow'});i+=2;continue;}
if(c==='='||c==='→'){tokens.push({t:'arrow'});i++;continue;}
if(c==='+'||c==='-'||c==='−'){
var v=c==='−'?'-':c;
if(isSeparator(str,i))tokens.push({t:'sep',v:v});
else tokens.push({t:'sign',v:v});
i++;continue;}
if(c==='('||c===')'){tokens.push({t:'paren',v:c});i++;continue;}
if(/[0-9]/.test(c)){var n='';while(i<str.length&&/[0-9]/.test(str[i])){n+=str[i];i++;}tokens.push({t:'num',v:n});continue;}
if(c==='e'||c==='E'){
if(i+1<str.length&&(str[i+1]==='⁻'||str[i+1]==='-')){
if(!(str[i+1]==='-'&&i+2<str.length&&str[i+2]==='>')){
var nx=str[i+2];
if(!nx||!/[a-zA-Z]/.test(nx)){tokens.push({t:'electron'});i+=2;continue;}}}}
var el=matchElement(str,i);
if(el){tokens.push({t:'elem',v:el.sym});i+=el.len;continue;}

return tokens;}

var nx2=i+2<tokens.length?tokens[i+2]:null;

i++;continue;}

function tokensToSpeciesText(tokens){
var out='';
for(var i=0;i<tokens.length;i++){
var tk=tokens[i];

else if(tk.t==='electron')out+='e⁻';}

function splitSpecies(str){
var parts=[],current='',i=0;
while(i<str.length){
var c=str[i];
if(c==='-'&&i+1<str.length&&str[i+1]==='>'){
if(trimZW(current))parts.push(trimZW(current));
current='';i+=2;continue;}
if(c==='+'||c==='-'||c==='−'){
var v=c==='−'?'-':c;
if(isSeparator(str,i)){
if(trimZW(current))parts.push(trimZW(current));
current='';
}else{current+=v;}
i++;continue;}
current+=c;i++;}
if(trimZW(current))parts.push(trimZW(current));
return parts.map(function(s){return s.replace(/^\d+/,'');});}

function extractCharge(s){
var m=s.match(/([+\-])[\s\u200B]*$/);
if(!m)return{formula:s,charge:0};
var before=s.slice(0,m.index);
var nm=before.match(/(\d+)[\s\u200B]*$/);
var num=nm?parseInt(nm[1],10):1;
var sign=m[1]==='+'?1:-1;
var formula=nm?before.slice(0,nm.index):before;
return{formula:trimZW(formula),charge:num*sign};}

function parseFormula(input){
var s=input,m=s.match(/^(\d+)/);
if(m)s=s.slice(m[1].length);
var counts={},stack=[counts],i=0;
while(i<s.length){
var c=s[i];
if(isSp(c)){i++;continue;}
if(c==='('){stack.push({});i++;}
else if(c===')'){
var grp=stack.pop();i++;
var num='';while(i<s.length&&/\d/.test(s[i])){num+=s[i];i++;}
var mlt=num?parseInt(num,10):1;
var par=stack[stack.length-1];
for(var k in grp)par[k]=(par[k]||0)+grp[k]*mlt;}
else if(/[A-Za-z]/.test(c)){
var el=matchElement(s,i);
if(!el){i++;continue;}
i+=el.len;
var num2='';while(i<s.length&&/\d/.test(s[i])){num2+=s[i];i++;}
var mult=num2?parseInt(num2,10):1;
var cur=stack[stack.length-1];
cur[el.sym]=(cur[el.sym]||0)+mult;}
else i++;}
return counts;}

function parseSpecies(s){
s=trimZW(s);
if(s==='e⁻'||s==='e-'||s==='e'){return{elements:{},charge:-1,isElectron:true};}
var ec=extractCharge(s);
return{elements:parseFormula(ec.formula),charge:ec.charge,isElectron:false};}

function isValidSpecies(sp){
if(!sp)return true;
if(!sp.replace(/[\u200B]/g,'').trim())return true;
var stripped=sp.replace(/[\u200B]/g,'');
if(stripped==='e'||stripped==='e-'||stripped==='e⁻')return true;
var ec=extractCharge(sp);
var comp=parseFormula(ec.formula);
var keys=Object.keys(comp);
if(!keys.length)return false;
for(var i=0;i<keys.length;i++){
if(!ELEM_FEATURES[keys[i]])return false;}
if(keys.length===1)return true;
var total=0;
for(var j=0;j<keys.length;j++)total+=comp[keys[j]]*ELEM_FEATURES[keys[j]].val;
var charge=Math.abs(ec.charge);
if((total%2)!==(charge%2))return false;
return true;}

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function fracApprox(x,maxDen){
maxDen=maxDen||2000;
if(Math.abs(x)<1e-9)return{n:0,d:1};
var sign=x<0?-1:1;x=Math.abs(x);
var h0=0,h1=1,k0=1,k1=0,b=x;
for(var i=0;i<40;i++){
var a=Math.floor(b);
var h2=a*h1+h0,k2=a*k1+k0;
if(k2>maxDen)break;
h0=h1;h1=h2;k0=k1;k1=k2;
var rem=b-a;if(rem<1e-12)break;b=1/rem;}
return{n:sign*h1,d:k1||1};}

function solveLinearSystem(M,m,n){
var A=M.map(function(row){return row.slice();});
var pivotCols=[],row=0;
for(var col=0;col<n&&row<m;col++){
var maxR=row;
for(var r=row+1;r<m;r++)if(Math.abs(A[r][col])>Math.abs(A[maxR][col]))maxR=r;
if(Math.abs(A[maxR][col])<1e-9)continue;
var tmp=A[row];A[row]=A[maxR];A[maxR]=tmp;
var pv=A[row][col];
for(var c=col;c<n;c++)A[row][c]/=pv;
for(var r2=0;r2<m;r2++){
if(r2!==row&&Math.abs(A[r2][col])>1e-9){
var f=A[r2][col];
for(var c2=col;c2<n;c2++)A[r2][c2]-=f*A[row][c2];}}
pivotCols.push(col);row++;
if(row===m)break;}
var freeCols=[];
for(var c3=0;c3<n;c3++)if(pivotCols.indexOf(c3)===-1)freeCols.push(c3);
if(!freeCols.length)return null;
var sol=new Array(n).fill(0);
sol[freeCols[0]]=1;
pivotCols.forEach(function(pc,idx){sol[pc]=-A[idx][freeCols[0]];});
if(sol.every(function(v){return Math.abs(v)<1e-9;}))return null;
var fracs=sol.map(function(v){return fracApprox(v);});
var lcm=1;
fracs.forEach(function(f){lcm=lcm*f.d/gcd(lcm,f.d);});
var ints=fracs.map(function(f){return Math.round(f.n*lcm/f.d);});
var g=0;ints.forEach(function(v){g=gcd(g,Math.abs(v));});
if(g>0)ints=ints.map(function(v){return v/g;});
for(var ii=0;ii<ints.length;ii++){
if(ints[ii]!==0){if(ints[ii]<0)ints=ints.map(function(v){return -v;});break;}}
if(ints.some(function(v){return v<=0;}))return null;
return ints;}

function balanceEquation(input){
var normalized=input.replace(/→|->/g,'=');
var eqSplit=normalized.split('=');
if(eqSplit.length!==2)return null;
var partsL=splitSpecies(eqSplit[0]);
var partsR=splitSpecies(eqSplit[1]);
if(!partsL.length||!partsR.length)return null;
var all=partsL.concat(partsR);
var parsed=all.map(parseSpecies);
var elemSet={};
parsed.forEach(function(p){for(var e in p.elements)elemSet[e]=1;});
var elems=Object.keys(elemSet);
var hasCharge=false;
parsed.forEach(function(p){if(p.charge!==0)hasCharge=true;});
if(!elems.length&&!hasCharge)return null;
var rows=elems.length+(hasCharge?1:0);
var n=all.length;
var M=[];
for(var i=0;i<rows;i++)M.push(new Array(n).fill(0));
parsed.forEach(function(p,j){
var sign=j<partsL.length?1:-1;
elems.forEach(function(e,i){if(p.elements[e])M[i][j]=sign*p.elements[e];});
if(hasCharge)M[elems.length][j]=sign*p.charge;});
var coefs=solveLinearSystem(M,rows,n);
if(!coefs)return null;
return{left:partsL,right:partsR,coefs:coefs};}

/* ===== 氧化剂产物（O2 / F2） ===== */
function oxidantProduct(elem,composition,oxidant){
if(oxidant==='O2'){
if(elem==='C')return'CO2';
if(elem==='H')return'H2O';
if(elem==='N')return'N2';
if(elem==='S')return'SO2';
if(elem==='P')return'P2O5';
if(elem==='Si')return'SiO2';
if(elem==='F'||elem==='Cl'||elem==='Br'){return composition&&composition.H?('H'+elem):(elem+'2');}
var f=ELEM_FEATURES[elem];
if(f&&f.val>0&&METALS[elem]){
var v=f.val;var g=gcd(2,v);var x=2/g,y=v/g;
return elem+(x>1?x:'')+'O'+(y>1?y:'');}
return null;}
if(oxidant==='F2'){
if(elem==='H')return'HF';
if(elem==='C')return'CF4';
if(elem==='N')return'NF3';
if(elem==='O')return'OF2';
if(elem==='S')return'SF6';
if(elem==='P')return'PF5';
if(elem==='Si')return'SiF4';
if(elem==='Cl')return'ClF';
if(elem==='Br')return'BrF3';
if(elem==='F')return null;
var f2=ELEM_FEATURES[elem];
if(f2&&f2.val>0&&METALS[elem]){
return elem+'F'+(f2.val>1?f2.val:'');}
return null;}
return null;}

/* ===== 元素候选产物（用于分组） ===== */
function productCandidates(elem,oxidant){
var f=ELEM_FEATURES[elem];
if(!f)return[];
if(oxidant==='O2'){
if(elem==='C')return['CO','CO2'];
if(elem==='H')return['H2O'];
if(elem==='N')return['N2'];
if(elem==='S')return['SO2'];
if(elem==='P')return['P2O5'];
if(elem==='Si')return['SiO2'];
if(elem==='F')return['F2'];
if(elem==='Cl')return['Cl2'];
if(elem==='Br')return['Br2'];
if(f.val>0&&METALS[elem]){
var v=f.val;var g=gcd(2,v);var x=2/g,y=v/g;
return[elem+(x>1?x:'')+'O'+(y>1?y:'')];}
return[];}
if(oxidant==='F2'){
if(elem==='H')return['HF'];
if(elem==='C')return['CF4'];
if(elem==='N')return['NF3'];
if(elem==='O')return['OF2'];
if(elem==='S')return['SF6'];
if(elem==='P')return['PF5'];
if(elem==='Si')return['SiF4'];
if(elem==='Cl')return['ClF'];
if(elem==='Br')return['BrF3'];
if(elem==='F')return[];
if(f.val>0&&METALS[elem]){return[elem+'F'+(f.val>1?f.val:'')];}
return[];}
return[];}

/* ===== 构建未配平燃烧方程式 ===== */
function buildCombustionEq(formula,oxidant){
var s=formula.replace(/^\d+/,'');
if(!s)return null;
var ec=extractCharge(s);
var comp=parseFormula(ec.formula);
var products=[];
Object.keys(comp).forEach(function(e){
var p=oxidantProduct(e,comp,oxidant);
if(p&&products.indexOf(p)===-1)products.push(p);});
if(!products.length)return null;
var leftStr=protect(s);
var rightStr=products.map(protect).join(' + ');
return leftStr+' + '+oxidant+' = '+rightStr;}

/* 返回配平后的燃烧结果对象（含 left / right / coefs），失败返回 null */
function predictCombustionBalanced(formula){
var eq=buildCombustionEq(formula,'O2');
if(eq){var bal=balanceEquation(eq);if(bal&&bal.coefs)return bal;}
eq=buildCombustionEq(formula,'F2');
if(eq){var bal2=balanceEquation(eq);if(bal2&&bal2.coefs)return bal2;}
return null;}

/* ===== 产物分组 ===== */
function computeProductGroups(reactantsStr,oxidant){
var species=splitSpecies(reactantsStr);
if(!species.length)return[];
var speciesForms=species.map(function(sp){
var ec=extractCharge(sp);return ec.formula.replace(/[\u200B]/g,'');});
var elements={};
species.forEach(function(sp){
var parsed=parseSpecies(sp);
var keys=Object.keys(parsed.elements);
if(keys.length===1&&keys[0]==='O'&&oxidant==='O2')return;
if(keys.length===1&&keys[0]==='F'&&oxidant==='F2')return;
for(var e in parsed.elements)elements[e]=1;});
var candidates=[];
Object.keys(elements).forEach(function(e){
if(oxidant==='O2'&&e==='O')return;
if(oxidant==='F2'&&e==='F')return;
var list=productCandidates(e,oxidant);
if(list.length)candidates.push(list);});
if(!candidates.length)return[];
var combos=[[]];
candidates.forEach(function(list){
var newCombos=[];
combos.forEach(function(c){
list.forEach(function(p){var nc=c.slice();nc.push(p);newCombos.push(nc);});});
combos=newCombos;});
if(combos.length>6)combos=combos.slice(0,6);
var seen={},result=[];
combos.forEach(function(c){
var uniq=[];
c.forEach(function(p){if(uniq.indexOf(p)===-1)uniq.push(p);});
var key=uniq.join('|');
if(seen[key])return;
seen[key]=1;
/* 跳过与反应物完全相同的恒等分组 */
var isIdentity=uniq.every(function(p){return speciesForms.indexOf(p)!==-1;});
if(isIdentity)return;
result.push(uniq);});
return result;}

function predictProductGroups(reactantsStr){
var o2Groups=computeProductGroups(reactantsStr,'O2');
if(o2Groups.length)return o2Groups;
return computeProductGroups(reactantsStr,'F2');}

/* ===== 电极反应拆分 ===== */
function electrodeReaction(eq){
var parts=eq.split('=');
if(parts.length!==2)return null;
var leftSp=splitSpecies(parts[0]);
var rightSp=splitSpecies(parts[1]);
if(!leftSp.length||!rightSp.length)return null;
var oxReact=[],redReact=[];
leftSp.forEach(function(sp){
var parsed=parseSpecies(sp);
var els=Object.keys(parsed.elements);
var isElemO=els.length===1&&els[0]==='O';
var isElemHal=els.length===1&&(els[0]==='F'||els[0]==='Cl'||els[0]==='Br');
if(isElemO||isElemHal)redReact.push(sp);else oxReact.push(sp);});
if(!oxReact.length)oxReact=[leftSp[0]];
if(!redReact.length)redReact=[leftSp[leftSp.length-1]];
var oxProd=[],redProd=[];
rightSp.forEach(function(sp){
var parsed=parseSpecies(sp);
var els=Object.keys(parsed.elements);
var hasO=els.indexOf('O')!==-1,hasC=els.indexOf('C')!==-1,hasH=els.indexOf('H')!==-1;
if(hasO&&hasH&&!hasC)redProd.push(sp);else oxProd.push(sp);});
if(!oxProd.length)oxProd=[rightSp[0]];
if(!redProd.length)redProd=[rightSp[rightSp.length-1]];
return['氧化: '+oxReact.join(' + ')+' → '+oxProd.join(' + ')+' + ne⁻',
'还原: '+redReact.join(' + ')+' + ne⁻ → '+redProd.join(' + ')];}

function buildKeyboard(){
var html='';
function elemKey(sym,col,row){
var cls='cc-key elem'+(METALS[sym]?' elem-metal':' elem-nonmetal');
return'<div class="'+cls+'" data-k="'+sym+'" style="grid-column:'+col+';grid-row:'+row+'">'+sym+'</div>';}
html+=elemKey('H',1,1);
for(var d=0;d<=9;d++)html+='<div class="cc-key num" data-k="'+d+'" style="grid-column:'+(2+d)+';grid-row:1">'+d+'</div>';
html+='<div class="cc-key op" data-k="+" style="grid-column:12;grid-row:1">+</div>';
html+='<div class="cc-key op" data-k="-" style="grid-column:13;grid-row:1">−</div>';
html+='<div class="cc-key op" data-k="=" style="grid-column:14;grid-row:1">=</div>';
html+='<div class="cc-key op" data-k="(" style="grid-column:15;grid-row:1">(</div>';
html+='<div class="cc-key op" data-k=")" style="grid-column:16;grid-row:1">)</div>';
html+='<div class="cc-key op" data-k="e⁻" style="grid-column:17;grid-row:1">e⁻</div>';
html+=elemKey('Li',1,2);
html+=elemKey('Be',2,2);
html+='<div class="cc-key fn dashed" data-act="space" style="grid-column:3/5;grid-row:2">分隔</div>';
html+='<div class="cc-key fn dashed" data-act="back" style="grid-column:5/7;grid-row:2">⌫</div>';
html+='<div class="cc-key fn dashed" data-act="clear" style="grid-column:7/9;grid-row:2">清空</div>';
html+='<div class="cc-key fn dashed wide" data-act="balance" style="grid-column:9/11;grid-row:2">配平</div>';
html+='<div class="cc-key fn dashed burn" data-act="burn" style="grid-column:11/13;grid-row:2">🔥 燃烧</div>';
['B','C','N','O','F'].forEach(function(sym,idx){html+=elemKey(sym,13+idx,2);});
html+=elemKey('Na',1,3);
html+=elemKey('Mg',2,3);
html+='<div class="cc-key fn dashed elec" data-act="elec" style="grid-column:3/5;grid-row:3">电极</div>';
['Al','Si','P','S','Cl'].forEach(function(sym,idx){html+=elemKey(sym,13+idx,3);});
Object.keys(PERIODIC[4]).forEach(function(col){
if(col==='18')return;
html+=elemKey(PERIODIC[4][col],col,4);});
return html;}

root.innerHTML='<div class="cc-wrap">'
+'<div class="cc-box"><div class="cc-input" contenteditable="true" id="ccInput" data-placeholder="输入化学式或方程式，每行一个，回车换行。" spellcheck="false" autocorrect="off" autocapitalize="off"></div></div>'
+'<div class="cc-msg" id="ccMsg"></div>'
+'<div class="cc-box"><div class="cc-kb" id="ccKb">'+buildKeyboard()+'</div></div>'
+'<div class="cc-predict" id="ccPredict"></div>'
+'</div>';

var inputEl=root.querySelector('#ccInput');
var msgEl=root.querySelector('#ccMsg');
var predictEl=root.querySelector('#ccPredict');
var kbEl=root.querySelector('#ccKb');
var refreshing=false;
var lastOffset=0;

function getInputText(){
var text='';
function walk(node){
if(node.nodeType===3){text+=node.nodeValue;}
else if(node.nodeName==='BR'){text+='\n';}
else if(node.nodeType===1){
for(var i=0;i<node.childNodes.length;i++)walk(node.childNodes[i]);}}
for(var i=0;i<inputEl.childNodes.length;i++)walk(inputEl.childNodes[i]);
return text;}

function processText(text){
text=text.replace(/[ \t]+/g,ZWSP);
text=cleanZW(text);
text=unicodeToPlain(text);
/* 每行应用 protect 消除多字母元素歧义 */
var lines=text.split('\n');
lines=lines.map(function(l){return protect(l);});
return lines.join('\n');}

function setInputText(text){
var processed=processText(text);
inputEl.innerHTML=renderInputHTML(processed)||'';
lastOffset=processed.length;}

function setInputTextWithOffset(text,offset){
var processed=processText(text);
inputEl.innerHTML=renderInputHTML(processed)||'';
lastOffset=Math.min(offset,processed.length);
if(document.activeElement===inputEl){setCursorTextOffset(lastOffset);}}

function renderInputHTML(text){
if(!text)return'';
var lines=text.split('\n');
var parts=[];
for(var i=0;i<lines.length;i++)parts.push(renderLineHTML(lines[i]));
return parts.join('<br>');}

function renderLineHTML(line){
if(!line)return'';
var tokens=tokenizeRaw(line);
var segs=[],current=[];
for(var i=0;i<tokens.length;i++){
var tk=tokens[i];
if(tk.t==='sep'||tk.t==='arrow'){
segs.push({type:'species',tokens:current});
segs.push({type:'op',text:(tk.t==='arrow'?'=':tk.v)});
current=[];}
else current.push(tk);}
segs.push({type:'species',tokens:current});
var html='';
for(var j=0;j<segs.length;j++){
var sg=segs[j];
if(sg.type==='op'){html+='<span class="cc-op">'+escapeHtml(sg.text)+'</span>';continue;}
var spText=tokensToSpeciesText(sg.tokens);
var cls=isValidSpecies(spText)?'sp-valid':'sp-invalid';
html+='<span class="'+cls+'">'+renderTokensToHTML(sg.tokens)+'</span>';}
return html;}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function getCursorTextOffset(){
var sel=window.getSelection();
if(!sel.rangeCount)return lastOffset;
var range=sel.getRangeAt(0);
if(!inputEl.contains(range.startContainer))return lastOffset;
var pre=document.createRange();
pre.selectNodeContents(inputEl);
pre.setEnd(range.startContainer,range.startOffset);
return pre.toString().length;}

function setCursorTextOffset(offset){
var walker=document.createTreeWalker(inputEl,NodeFilter.SHOW_TEXT,null,false);
var count=0,node;
while(node=walker.nextNode()){
var len=node.nodeValue.length;
if(count+len>=offset){
var range=document.createRange();
try{range.setStart(node,Math.min(offset-count,len));}catch(e){range.setStart(node,len);}
range.collapse(true);
var sel=window.getSelection();
sel.removeAllRanges();
sel.addRange(range);
return;}
count+=len;}
var range=document.createRange();
range.selectNodeContents(inputEl);
range.collapse(false);
var sel=window.getSelection();
sel.removeAllRanges();
sel.addRange(range);}

function refresh(){
if(refreshing)return;
refreshing=true;
try{
var oldText=getInputText();
var cursorBefore=(document.activeElement===inputEl)?getCursorTextOffset():lastOffset;
var processed=processText(oldText);
var html=renderInputHTML(processed);
if(inputEl.innerHTML!==html){inputEl.innerHTML=html||'';}
lastOffset=Math.min(cursorBefore,processed.length);
if(document.activeElement===inputEl){setCursorTextOffset(lastOffset);}
}catch(e){}
refreshing=false;
updatePredictions();}

inputEl.addEventListener('input',function(){lastOffset=getCursorTextOffset();refresh();});
inputEl.addEventListener('paste',function(){setTimeout(function(){refresh();},0);});
inputEl.addEventListener('keydown',function(e){
if(e.key==='Enter'&&!e.shiftKey){
e.preventDefault();
insertTextNode(document.createElement('br'));
refresh();}
else if(e.key===' '&&!e.ctrlKey&&!e.metaKey){
e.preventDefault();
insertTextNode(document.createTextNode(ZWSP));
refresh();}});
inputEl.addEventListener('keyup',function(){lastOffset=getCursorTextOffset();updatePredictions();});
inputEl.addEventListener('click',function(){lastOffset=getCursorTextOffset();updatePredictions();});
inputEl.addEventListener('mouseup',function(){lastOffset=getCursorTextOffset();updatePredictions();});
inputEl.addEventListener('blur',function(){updatePredictions();});

function insertTextNode(node){
var sel=window.getSelection();
if(!sel.rangeCount)return;
var range=sel.getRangeAt(0);
range.deleteContents();
range.insertNode(node);
range.setStartAfter(node);
range.collapse(true);
sel.removeAllRanges();
sel.addRange(range);}

function insertAtCursor(text){
var plain=getInputText();
var off=Math.min(lastOffset,plain.length);
var newText=plain.slice(0,off)+text+plain.slice(off);
setInputTextWithOffset(newText,off+text.length);
updatePredictions();}

function backspace(){
var plain=getInputText();
var off=Math.min(lastOffset,plain.length);
if(off<=0)return;
var newText=plain.slice(0,off-1)+plain.slice(off);
setInputTextWithOffset(newText,off-1);
updatePredictions();}

kbEl.addEventListener('click',function(e){
var btn=e.target.closest('.cc-key');
if(!btn)return;
var k=btn.getAttribute('data-k');
var act=btn.getAttribute('data-act');
if(act==='space'){insertAtCursor(ZWSP);return;}
if(act==='back'){backspace();return;}
if(act==='clear'){inputEl.innerHTML='';lastOffset=0;msgEl.textContent='';msgEl.className='cc-msg';predictEl.innerHTML='';return;}
if(act==='balance'){doBalanceAll();return;}
if(act==='burn'){doBurnAll();return;}
if(act==='elec'){doElectrodeAll();return;}
if(k!==null)insertAtCursor(k);});

function doBalanceAll(){
var text=unicodeToPlain(getInputText());
var lines=text.split('\n');
var newLines=[],ok=0,err=0;
for(var i=0;i<lines.length;i++){
var line=trimZW(lines[i]);
if(!line){newLines.push('');continue;}
if(line.indexOf('=')===-1&&line.indexOf('→')===-1&&line.indexOf('->')===-1){newLines.push(line);continue;}
try{
var res=balanceEquation(line);
if(res&&res.coefs){
var lft=res.left.map(function(f,j){var c=res.coefs[j];return(c!==1?c:'')+f;}).join(' + ');
var rgt=res.right.map(function(f,j){var c=res.coefs[res.left.length+j];return(c!==1?c:'')+f;}).join(' + ');
newLines.push(lft+' = '+rgt);ok++;}
else{newLines.push(line);err++;}}
catch(e){newLines.push(line);err++;}}
setInputText(newLines.join('\n'));
if(ok&&!err){msgEl.textContent='全部配平成功 ('+ok+')';msgEl.className='cc-msg ok';}
else if(ok){msgEl.textContent='部分成功: '+ok+' 配平, '+err+' 失败';msgEl.className='cc-msg ok';}
else{msgEl.textContent='无法配平';msgEl.className='cc-msg err';}
updatePredictions();}

function doBurnAll(){
var text=unicodeToPlain(getInputText());
var lines=text.split('\n');
var newLines=[],ok=0,err=0;
for(var i=0;i<lines.length;i++){
var line=trimZW(lines[i]);
if(!line){newLines.push('');continue;}
if(line.indexOf('=')===-1&&line.indexOf('→')===-1&&line.indexOf('->')===-1){newLines.push(line);err++;continue;}
try{
var eqParts=line.split(/[=]|→|->/);
var target=eqParts[0].split('+')[0].trim();
var bal=predictCombustionBalanced(target);
if(bal&&bal.coefs){
var lft=bal.left.map(function(f,j){var c=bal.coefs[j];return(c!==1?c:'')+f;}).join(' + ');
var rgt=bal.right.map(function(f,j){var c=bal.coefs[bal.left.length+j];return(c!==1?c:'')+f;}).join(' + ');
newLines.push(lft+' = '+rgt);ok++;}
else{newLines.push(line);err++;}}
catch(e){newLines.push(line);err++;}}
setInputText(newLines.join('\n'));
if(ok&&!err){msgEl.textContent='燃烧预测并配平成功 ('+ok+')';msgEl.className='cc-msg ok';}
else if(ok){msgEl.textContent='部分成功: '+ok+' 成功, '+err+' 失败';msgEl.className='cc-msg ok';}
else{msgEl.textContent='燃烧失败：默认 O₂ 氧化剂；如为水等可用 F₂ 氧化剂';msgEl.className='cc-msg err';}
updatePredictions();}

function doElectrodeAll(){
var text=unicodeToPlain(getInputText());
var lines=text.split('\n');
var out=[],ok=0,err=0;
for(var i=0;i<lines.length;i++){
var line=trimZW(lines[i]);
if(!line){out.push('');continue;}
if(line.indexOf('=')===-1&&line.indexOf('→')===-1&&line.indexOf('->')===-1){out.push(line);err++;continue;}
try{
var normalized=line.replace(/→|->/g,'=');
var electrode=electrodeReaction(normalized);
if(electrode){out.push(electrode[0]);out.push(electrode[1]);ok++;}
else{out.push(line);err++;}}
catch(e){out.push(line);err++;}}
setInputText(out.join('\n'));
if(ok&&!err){msgEl.textContent='电极反应拆分成功 ('+ok+')';msgEl.className='cc-msg ok';}
else if(ok){msgEl.textContent='部分成功: '+ok+' 拆分, '+err+' 失败';msgEl.className='cc-msg ok';}
else{msgEl.textContent='电极拆分失败：需含=的氧化还原方程式';msgEl.className='cc-msg err';}
updatePredictions();}

function getTextBeforeCursor(){
var sel=window.getSelection();
if(!sel.rangeCount)return getInputText();
var range=sel.getRangeAt(0);
if(!inputEl.contains(range.startContainer))return getInputText();
var result='',found=false;
function walk(node){
if(found)return;
if(node===range.startContainer){
if(node.nodeType===3)result+=node.nodeValue.slice(0,range.startOffset);
found=true;return;}
if(node.nodeType===3)result+=node.nodeValue;
else if(node.nodeName==='BR')result+='\n';
else if(node.nodeType===1){
for(var i=0;i<node.childNodes.length;i++){walk(node.childNodes[i]);if(found)return;}}}
for(var i=0;i<inputEl.childNodes.length;i++){walk(inputEl.childNodes[i]);if(found)break;}
return result;}

function updatePredictions(){
var before=getTextBeforeCursor();
var lineStart=before.lastIndexOf('\n')+1;
var currentLine=before.slice(lineStart);
if(currentLine.indexOf('=')===-1){predictEl.innerHTML='';return;}
var eqPos=currentLine.indexOf('=');
var reactants=currentLine.slice(0,eqPos).trim();
if(!reactants){predictEl.innerHTML='';return;}
var groups=predictProductGroups(reactants);
if(!groups.length){predictEl.innerHTML='';return;}
var html='<span class="cc-predict-label">预测产物:</span>';
groups.forEach(function(g){
var display=g.map(function(f){
var p=protect(f);
var tokens=tokenizeRaw(p);
return renderTokensToHTML(tokens);}).join('<span class="cc-plus">+</span>');
var data=g.join('+');
html+='<div class="cc-predict-btn" data-p="'+data+'">'+display+'</div>';});
predictEl.innerHTML=html;}

predictEl.addEventListener('click',function(e){
var btn=e.target.closest('.cc-predict-btn');
if(!btn)return;
var p=btn.getAttribute('data-p');
insertAtCursor(p);});

refresh();
}};}});

App.init();
</script></body></html>
